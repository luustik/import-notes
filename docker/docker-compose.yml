volumes:
  pg_new_system:

services:

  new-system:
    image: new-system
    container_name: new-system
    build:
      context: ../new-system
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${NEW_DB_USERNAME}
      - DB_PASSWORD=${NEW_DB_PASSWORD}
      - OLD_SYSTEM_BASE_URL=${OLD_SYSTEM_BASE_URL}
    networks:
      - new-system
    depends_on:
      new_system_db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://new-system:8080/actuator/health" ]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 10s

  new_system_db:
    image: postgres:15.1-alpine
    container_name: new-system-db
    environment:
      - POSTGRES_USER=${NEW_DB_USERNAME}
      - POSTGRES_PASSWORD=${NEW_DB_PASSWORD}
      - POSTGRES_DB=new_system_db
    volumes:
      - pg_new_system:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - new-system
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${NEW_DB_USERNAME} -d new_system_db" ]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  new-system:
    driver: bridge